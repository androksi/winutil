name: Publish WinUtil script to Pages

# Serves the compiled script at https://androksi.github.io/winutil/win so it can be started with
# irm https://androksi.github.io/winutil/win | iex

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'androksi/winutil'
    runs-on: windows-latest
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7

      - name: Compile winutil.ps1
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force; ./Compile.ps1

      - name: Upload compiled script
        uses: actions/upload-artifact@v7
        with:
          name: winutil-ps1
          path: ./winutil.ps1

  # Pages packaging runs on Linux, as in docs.yaml
  deploy:
    if: github.repository == 'androksi/winutil'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download compiled script
        uses: actions/download-artifact@v8
        with:
          name: winutil-ps1

      - name: Stage the script
        run: |
          mkdir -p _site
          cp winutil.ps1 _site/win
          cp winutil.ps1 _site/winutil.ps1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
